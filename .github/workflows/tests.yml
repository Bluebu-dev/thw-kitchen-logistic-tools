name: Application checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kitchen_test
          POSTGRES_PASSWORD: isolated-ci-test-password
          POSTGRES_DB: kitchen_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U kitchen_test -d kitchen_test'
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://kitchen_test:isolated-ci-test-password@127.0.0.1:5432/kitchen_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: pip install -r tests/requirements.txt
      - run: python -m pytest -q
      - run: node --check frontend/src/scripts/app.js

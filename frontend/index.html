<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#081527" />
    <title>THW Küchenlogistik</title>
    <link rel="stylesheet" href="/assets/style.css" />
    <link rel="stylesheet" href="/assets/extra.css" />
    <link rel="stylesheet" href="/assets/workspace.css" />
    <script defer src="/assets/app.js"></script>
  </head>
  <body>
    <div id="login-screen" class="auth-screen">
      <form id="login-form" class="auth-card">
        <div class="brand-logo">
          <img src="/api/settings/logo" alt="THW-Logo" /><strong class="ov-name"
            >Ortsverband Passau</strong
          >
        </div>
        <h1>Küchenlogistik</h1>
        <p>Einsätze vorbereiten. Vorräte im Blick. Kontrollen dokumentieren.</p>
        <label
          >Benutzername<input
            name="username"
            autocomplete="username"
            required /></label
        ><label
          >Passwort<input
            name="password"
            type="password"
            autocomplete="current-password"
            required /></label
        ><button class="btn primary">Anmelden</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </div>
    <div id="application" class="shell hidden">
      <aside class="sidebar">
        <div class="brand-logo">
          <img src="/api/settings/logo" alt="THW-Logo" /><strong class="ov-name"
            >Ortsverband Passau</strong
          ><small>KÜCHENLOGISTIK</small>
        </div>
        <div class="side-label">ARBEITSPLATZ</div>
        <nav aria-label="Hauptnavigation">
          <button class="nav-item" data-view="events">
            ▦ Einsätze & Veranstaltungen</button
          ><button class="nav-item" data-view="stock">
            ☷ Lebensmittel & Getränke</button
          ><button class="nav-item" data-view="temperatures">
            ♨ Temperaturkontrolle</button
          ><button class="nav-item" data-view="files">▤ Dateiablage</button
          ><button class="nav-item kitchen-only" data-view="templates">
            ▧ Vorgangsvorlagen</button
          ><button class="nav-item kitchen-only" data-view="forms">
            ✓ Spez71-Nachweise</button
          ><button class="nav-item admin-only" data-view="archive">
            ◷ Archiv · 10 Jahre</button
          ><button class="nav-item admin-only" data-view="users">
            ♙ Benutzer & API</button
          ><button class="nav-item admin-only" data-view="settings">
            ⚙ OV-Konfiguration</button
          ><button class="nav-item admin-only" data-view="audit">
            ≡ Änderungsprotokoll
          </button>
        </nav>
        <div class="account">
          <small id="logged-user"></small
          ><button id="logout" class="btn subtle">Abmelden</button>
        </div>
      </aside>
      <main class="content">
        <header class="topbar">
          <div>
            <div class="eyebrow ov-name">TECHNISCHES HILFSWERK</div>
            <h1 id="page-title">Einsätze & Veranstaltungen</h1>
          </div>
          <div class="top-actions">
            <button class="btn primary" id="new-event">
              ＋ Vorgang anlegen
            </button>
          </div>
        </header>
        <div
          id="message"
          class="message hidden"
          role="status"
          aria-live="polite"
        ></div>
        <div id="workspace"></div>
      </main>
    </div>
    <footer class="screen-footer">
      <span class="ov-name">THW</span> · Küchenlogistik
      <span>Eigenständige Anwendung · Keine offizielle THW-Anwendung</span>
    </footer>
    <dialog id="editor">
      <form id="editor-form">
        <div class="dialog-head">
          <h2 id="editor-title"></h2>
          <button
            type="button"
            class="icon-button close-editor"
            aria-label="Schließen"
          >
            ✕
          </button>
        </div>
        <div id="editor-fields"></div>
        <p id="editor-error" class="error" role="alert"></p>
        <div class="dialog-actions">
          <button type="button" class="btn subtle close-editor">
            Abbrechen</button
          ><button class="btn primary" id="editor-submit">Speichern</button>
        </div>
      </form>
    </dialog>
  </body>
</html>

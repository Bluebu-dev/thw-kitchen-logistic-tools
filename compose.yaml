services:
  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-thwkueche}:${POSTGRES_PASSWORD:?Passwort in .env setzen}@db:5432/${POSTGRES_DB:-thwkueche}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Erstpasswort in .env setzen}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OV_NAME: ${OV_NAME:-Ortsverband Passau}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thwkueche}
      POSTGRES_USER: ${POSTGRES_USER:-thwkueche}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Passwort in .env setzen}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    security_opt:
      - no-new-privileges:true
volumes:
  postgres_data:
